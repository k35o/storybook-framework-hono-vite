packages:
  - packages/*
  - examples/*

catalog:
  '@storybook/addon-a11y': 10.5.10
  '@storybook/addon-vitest': 10.5.10
  '@storybook/builder-vite': 10.5.10
  '@types/node': 25.9.5
  '@vitest/browser-playwright': 4.1.11
  hono: 4.13.5
  honox: 0.1.61
  playwright: 1.62.1
  storybook: 10.5.10
  typescript: 7.0.2
  vite: 8.2.2
  vite-plus: 0.3.0
  vitest: 4.1.11

blockExoticSubdeps: true

allowBuilds:
  '@swc/core': false
  esbuild: false

minimumReleaseAge: 4320

verifyDepsBeforeRun: install
minimumReleaseAgeExclude:
  # Renovate security update: hono@4.12.25 || 4.12.34
