packages:
  - packages/*
  - examples/*

catalog:
  '@storybook/addon-a11y': 10.6.8
  '@storybook/addon-vitest': 10.6.8
  '@storybook/builder-vite': 10.6.8
  '@types/node': 25.9.9
  '@vitest/browser-playwright': 5.1.1
  hono: 4.13.19
  honox: 0.1.63
  playwright: 1.65.1
  storybook: 10.6.8
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vitest: 5.1.1

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

blockExoticSubdeps: true

allowBuilds:
  '@swc/core': false
  esbuild: false

minimumReleaseAge: 4320

verifyDepsBeforeRun: install
minimumReleaseAgeExclude:
  # Renovate security update: hono@4.12.25 || 4.12.34
  - hono@4.12.25 || 4.12.34

versioning:
  changelog:
    storage: repository
