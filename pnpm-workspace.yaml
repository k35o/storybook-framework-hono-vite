packages:
  - packages/*
  - examples/*

catalog:
  '@storybook/addon-a11y': 10.6.6
  '@storybook/addon-vitest': 10.6.6
  '@storybook/builder-vite': 10.6.6
  '@types/node': 25.9.9
  '@vitest/browser-playwright': 5.1.0
  hono: 4.13.16
  honox: 0.1.62
  playwright: 1.65.0
  storybook: 10.6.6
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  vitest: 5.1.0

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

blockExoticSubdeps: true

allowBuilds:
  '@swc/core': false
  esbuild: false

minimumReleaseAge: 4320

verifyDepsBeforeRun: install
minimumReleaseAgeExclude:
  # Renovate security update: hono@4.12.25 || 4.12.34
  - hono@4.12.25 || 4.12.34

versioning:
  changelog:
    storage: repository
